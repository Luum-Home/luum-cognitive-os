schema_version: 1
harness: claude-code
description: >
  Published hook OUTPUT schema of the Claude Code harness, transcribed from
  upstream documentation. This manifest is the EXTERNAL contract: it records
  what Claude Code itself consumes, independent of what this repo's hooks
  happen to emit. The conformance test validates our hooks against THIS file,
  so a hook that agrees only with itself cannot pass.

  Scope note: unlike manifests/codex-hooks-schema.yaml (which describes a
  projection this repo GENERATES), Claude Code is the harness this repo RUNS
  ON. The hooks in hooks/ are hand-written, not generated, so this manifest is
  the only place the host contract is written down. Before this file existed,
  the contract lived nowhere and two hooks had been emitting a shape the host
  silently discards.

sources:
  - url: https://code.claude.com/docs/en/hooks.md
    what: >
      Hooks reference, raw markdown (272682 bytes as fetched). Sections used —
      "JSON output" (universal fields, the three field kinds), "Add context for
      Claude" (additionalContext placement and per-event insertion point),
      "Decision control" (which events honor which fields), "Exit code 0"
      (stdout-vs-JSON parsing rule), "Exit code 2 behavior per event",
      "SubagentStart" (input fields and output table), "Run hooks in the
      background" (async semantics).
    verified: 2026-08-15
    how: >
      curl -sSL https://code.claude.com/docs/en/hooks.md
      Fetched and grepped locally rather than summarized, because the HTML page
      truncates under WebFetch and three separate summarization passes each
      lost the additionalContext placement rule.
  - url: https://code.claude.com/docs/en/hooks.md
    what: >
      Same reference, RE-FETCHED 2026-08-19 and diffed against the 2026-08-15
      transcription. The document had changed: 277223 bytes vs the 272682
      recorded above. Sections newly transcribed into this manifest —
      "Common fields" (the `if`, `statusMessage` and `once` handler fields),
      "Command hook fields" (`args`, `asyncRewake`, `shell`),
      "Exec form and shell form", "Bash `if` matching", plus the per-event
      blocks for PreCompact, TaskCreated and TeammateIdle, which this repo
      REGISTERS and this manifest had not transcribed.
    verified: 2026-08-19
    how: >
      curl -sSL https://code.claude.com/docs/en/hooks.md -o /tmp/hooks.md
      (HTTP 200, 277223 bytes, no redirect), then, on the local copy:
      grep -n '"if"\|"args"\|"shell"\|asyncRewake\|statusMessage\|"once"' /tmp/hooks.md
      sed -n '400,600p' /tmp/hooks.md          # "Hook handler fields"
      sed -n '822,862p' /tmp/hooks.md          # "Exit code 2 behavior per event"
      sed -n '978,1000p' /tmp/hooks.md         # "Decision control" table
      Byte count from the curl `-w '%{size_download}'` write-out. Six of six
      hypothesised fields exist; none is invented. `once` returns 0 hits when
      grepped WITH quotes ('"once"') and 1 hit unquoted — the field is real and
      a quoted grep alone would have produced a false refutation.
  - url: https://code.claude.com/docs/en/agent-sdk/hooks
    what: >
      Agent SDK hooks page. Used for the sentence distinguishing
      hookSpecificOutput (controls the current operation) from
      additionalContext (passes context to the model), and for confirmation
      that agent_id/agent_type are required fields on SubagentStart.
    verified: 2026-08-15
  - note: >
      Mirror behaviour observed 2026-08-15, recorded because it burned time:
      https://code.claude.com/docs/en/sdk/sdk-typescript issues a 301 to
      https://docs.claude.com/en/docs/agent-sdk/typescript — that is
      code.claude.com redirecting TO docs.claude.com, the opposite direction
      from the 301 recorded elsewhere in this repo. Both hosts are live and
      redirect each other for different path prefixes; neither is safe to
      assume canonical. Prefer the .md suffix on code.claude.com: it returns
      the full source and does not truncate.
  - note: >
      Re-verify on the dates above before trusting a claim in a later session.
      When Claude Code changes its contract, this file is the single place to
      update and tests/contracts/test_claude_code_hooks_schema_conformance.py
      starts failing on its own.

# ── The one rule that matters ─────────────────────────────────────────────────
# There is NO top-level `additionalContext` field. Not for any event.
# A hook that prints {"additionalContext": "..."} at the root emits valid JSON
# that the host parses and then discards, because the field is not in the
# schema. The failure is SILENT: no error, no warning, no fallback to plain
# text (see stdout_parsing below — a payload starting with `{` that parses as
# valid JSON is never re-read as plain text).
additional_context:
  placement: hookSpecificOutput.additionalContext
  root_level_allowed: false
  requires_sibling: hookEventName
  quote: >
    "Return `additionalContext` inside `hookSpecificOutput` alongside the event
    name" — hooks.md, section "Add context for Claude".
  canonical_shape: |
    {
      "hookSpecificOutput": {
        "hookEventName": "<EventName>",
        "additionalContext": "<string>"
      }
    }
  max_chars: 10000
  overflow_behavior: >
    Output exceeding 10,000 characters is saved to a file in the session
    directory and replaced with a preview plus the file path.
  multi_hook_behavior: >
    When several hooks return additionalContext for the same event, Claude
    receives all of the values.
  authoring_guidance: >
    Write the text as factual statements, not imperative system instructions.
    Text framed as out-of-band system commands can trigger Claude's
    prompt-injection defenses, which causes Claude to surface the text to the
    user instead of treating it as context.

  # Where the injected reminder lands, per event.
  insertion_point:
    - events: [SessionStart, Setup, SubagentStart]
      where: at the start of the conversation, before the first prompt
    - events: [UserPromptSubmit, UserPromptExpansion]
      where: alongside the submitted prompt
    - events: [PreToolUse, PostToolUse, PostToolUseFailure, PostToolBatch]
      where: next to the tool result
    - events: [Stop, SubagentStop]
      where: at the end of the turn

# ── How the host decides whether stdout is JSON or prose ──────────────────────
# Decided by the FIRST non-whitespace character. This is why the flat form
# fails silently instead of degrading into plain-text context.
stdout_parsing:
  quote: >
    "Whether Claude Code reads your stdout as JSON output or as plain text
    depends on its first character, ignoring leading whitespace" — hooks.md,
    section "Exit code 0".
  rules:
    - starts_with: "{"
      behavior: >
        Parsed as JSON. If it is NOT valid JSON, treated as plain text. If it
        IS valid JSON, it is structured output and unrecognized fields are
        dropped — there is no fallback to plain text.
    - starts_with: anything else
      behavior: >
        Treated as plain text, including a JSON array or a quoted JSON string.
  plain_text_stdout_becomes_context_for:
    - UserPromptSubmit
    - UserPromptExpansion
    - SessionStart
  plain_text_stdout_elsewhere: >
    For every other event, stdout goes to the debug log and is not shown in the
    transcript.

# ── Universal JSON fields, accepted by every event ────────────────────────────
universal_fields:
  continue:
    default: true
    note: "If false, Claude stops processing entirely after the hook runs."
  stopReason:
    note: "Shown to the user when continue is false. Not shown to Claude."
  suppressOutput:
    note: >
      Accepted but inert — the host does not act on it. Recorded here so nobody
      "fixes" a hook by setting it.
  systemMessage:
    note: "Warning shown to the USER, not to the model."
  terminalSequence:
    note: >
      Terminal escape sequence, restricted to OSC 0/1/2/9/99/777 and BEL.
      Anything outside the allowlist makes the field ignored.

# ── Per-event decision control ────────────────────────────────────────────────
# SCOPE RULE: every event this repo actually registers is transcribed in full.
# The "context only" group is the one that matters for the injector family.
#
# 2026-08-19: the rule above was stated here since 2026-08-15 and was NOT true.
# The repo registers ten events; six were transcribed. PreCompact, TaskCreated
# and TeammateIdle were registered in .claude/settings.json and absent from this
# file, so the conformance test could not check the hooks sitting on them. They
# are transcribed below. Measured with:
#   COS_ALLOW_PROTECTED_CONFIG_WRITE=1 python3 -c "import json;d=json.load(open('.claude/settings.json'));[print(k,sum(len(g.get('hooks',[])) for g in v)) for k,v in sorted(d['hooks'].items())]"
# -> PostToolUse 57, PreToolUse 39, SessionStart 27, Stop 23, UserPromptSubmit 12,
#    PreCompact 1, SubagentStart 1, TaskCreated 1, TeammateIdle 1, TaskCompleted 0.
#
# Events NOT transcribed in full, and why — recorded so the next reader does not
# re-derive it. This repo registers no handler on any of them (same command):
#   ConfigChange, Setup, InstructionsLoaded, UserPromptExpansion, MessageDisplay,
#   PermissionRequest, PostToolUseFailure, PostToolBatch, PermissionDenied,
#   Notification, SubagentStop, StopFailure, CwdChanged, DirectoryAdded,
#   FileChanged, WorktreeCreate, WorktreeRemove, PostCompact, SessionEnd,
#   Elicitation, ElicitationResult.
# ConfigChange is called out by name because it is the one with real blocking
# power we deliberately leave unused: it can block a settings change from taking
# effect, and a repo that guards .claude/settings.json with a PreToolUse write
# guard has an obvious reason to want it. Not registering it is a decision, not
# an oversight, so it stays out of the transcription and in this list.
events:
  SubagentStart:
    fires_when: "A Claude Code subagent is spawned via the Agent tool."
    matcher_supported: true
    matcher_semantics: >
      Regex against the agent type name. Built-in agents use the agent name
      (general-purpose, Explore, Plan). Custom subagents use the `name` field
      from frontmatter, not the filename. Plugin subagents use the
      plugin-scoped identifier (my-plugin:reviewer) — anchor with ^...$ because
      the colon puts it on the regex path.
    stdin_fields:
      required: [session_id, transcript_path, cwd, hook_event_name, agent_id, agent_type]
    can_block: false
    exit_2_behavior: "Shows stderr to user only."
    decision_pattern: "context only"
    output_fields_allowed: [additionalContext]
    output_fields_ignored: [permissionDecision, permissionDecisionReason, decision, reason]
    quote: >
      "SubagentStart hooks can't block subagent creation, but they can inject
      context into the subagent." — hooks.md, section "SubagentStart".

  UserPromptSubmit:
    can_block: true
    exit_2_behavior: "Blocks prompt processing and erases the prompt."
    decision_pattern: "top-level decision"
    decision_fields: [decision, reason]
    output_fields_allowed: [additionalContext]
    plain_stdout_is_context: true

  SessionStart:
    can_block: false
    exit_2_behavior: "Shows stderr to user only."
    decision_pattern: "context only"
    output_fields_allowed:
      - additionalContext
      - initialUserMessage
      - watchPaths
      - sessionTitle
      - reloadSkills
    plain_stdout_is_context: true
    resume_behavior: >
      SessionStart hooks re-run on resume with `source` set to "resume", or
      "fork" with --fork-session. Mid-session events (PostToolUse,
      UserPromptSubmit) do NOT re-run — the host replays saved text, so
      timestamps and commit SHAs go stale on --continue/--resume.

  PreToolUse:
    can_block: true
    exit_2_behavior: "Blocks the tool call."
    decision_pattern: hookSpecificOutput
    decision_fields: [permissionDecision, permissionDecisionReason, updatedInput]
    permission_decision_values: [allow, deny, ask, defer]
    output_fields_allowed: [additionalContext, permissionDecision, permissionDecisionReason, updatedInput]

  PostToolUse:
    can_block: false
    decision_pattern: "top-level decision"
    decision_fields: [decision, reason]
    output_fields_allowed: [additionalContext, updatedToolOutput]

  Stop:
    can_block: true
    exit_2_behavior: "Prevents Claude from stopping, continues the conversation."
    decision_pattern: "top-level decision"
    output_fields_allowed: [additionalContext]

  # ── Registered here since before 2026-08-15, transcribed 2026-08-19 ──────────
  PreCompact:
    fires_when: "Before Claude Code runs a compact operation."
    registered_hook: hooks/pre-compaction-flush.sh
    matcher_supported: true
    matcher_values: [manual, auto]
    matcher_semantics: >
      "manual" fires on /compact; "auto" on auto-compact when the context
      window fills.
    can_block: true
    exit_2_behavior: "Blocks compaction."
    decision_pattern: "top-level decision"
    decision_fields: [decision, reason]
    output_fields_ignored: [systemMessage, continue]
    blocking_side_effects: >
      Blocking a PROACTIVE auto-compact skips it and the conversation continues
      uncompacted. Blocking a compaction triggered to RECOVER from a
      context-limit error the API already returned surfaces that error and the
      current request fails. Two different outcomes behind one decision.
    quote: >
      "Exit with code 2 to block compaction. [...] Claude Code discards a
      PreCompact hook's `systemMessage` and `continue` fields." — hooks.md,
      section "PreCompact".

  TaskCreated:
    fires_when: "A task is being created via the TaskCreate tool."
    registered_hook: hooks/task-created.sh
    matcher_supported: false
    matcher_semantics: >
      "TaskCreated hooks don't support matchers and fire on every occurrence."
      A matcher written here is not honoured.
    does_not_fire_when: >
      The session has no Task tools available.
    can_block: true
    exit_2_behavior: "Rolls back the task creation; stderr is returned to Claude as the tool error."
    decision_pattern: "exit code or top-level decision"
    decision_fields: [decision, reason]
    output_fields_ignored: [continue]
    note_on_continue: >
      "Claude Code ignores `continue: false` from this event and Claude keeps
      working." A hook that tries to halt the session from here fails silently.
    stdin_fields:
      required: [session_id, transcript_path, cwd, hook_event_name, task_id, task_subject]
      optional: [task_description, teammate_name, team_name]
      deprecated: [team_name]

  TeammateIdle:
    fires_when: "A teammate is about to go idle."
    registered_hook: hooks/teammate-idle.sh
    can_block: true
    exit_2_behavior: "Prevents the teammate from going idle, so it continues working."
    decision_pattern: "exit code or continue: false"
    decision_fields: [continue, stopReason]
    note: >
      Unlike the top-level-decision family, this event does NOT take
      `decision: "block"`. It takes exit code 2, or JSON
      {"continue": false, "stopReason": "..."} which stops the teammate
      entirely, matching Stop-hook behaviour. Writing `decision: "block"` here
      is inert.

  # Declared in cognitive-os.yaml with default_projection: false, therefore NOT
  # in .claude/settings.json (0 handlers, verified 2026-08-19). Transcribed
  # anyway because the declaration exists and flipping the projection flag is a
  # one-line change that should not require re-reading the host docs.
  TaskCompleted:
    fires_when: >
      A task is marked completed through TaskUpdate, or an agent-teams teammate
      finishes its turn with in-progress tasks.
    declared_hook: hooks/task-completed.sh
    projected_to_settings: false
    can_block: true
    exit_2_behavior: "Prevents the task from being marked as completed."
    decision_pattern: "exit code or continue: false"
    decision_fields: [continue, stopReason]

# ── Handler configuration fields ──────────────────────────────────────────────
handler_fields:
  type:
    values: [command, http, mcp_tool, prompt, agent]
  # ── `if` — the field that silently disables a hook ──────────────────────────
  # Verified 2026-08-19. THE TRAP: `if` is only evaluated on TOOL events. On any
  # other event a handler that declares `if` NEVER RUNS. There is no error and no
  # warning: the hook is simply absent. Same silent-discard family as root-level
  # additionalContext above, one level up — there the OUTPUT is dropped, here the
  # whole HANDLER is.
  if:
    applies_to: all hook types
    evaluated_only_on: [PreToolUse, PostToolUse, PostToolUseFailure, PermissionRequest, PermissionDenied]
    on_other_events: >
      The handler never runs. Not an error, not a warning — silent.
    quote: >
      "Only evaluated on tool events: PreToolUse, PostToolUse,
      PostToolUseFailure, PermissionRequest, and PermissionDenied. On other
      events, a hook with `if` set never runs." — hooks.md, "Common fields".
    syntax: >
      Exactly ONE permission rule, e.g. "Bash(git *)" or "Edit(*.ts)". No &&,
      no ||, no list form. Multiple conditions require multiple handlers.
    fails_open: >
      When the Bash command cannot be parsed the filter runs the hook anyway.
      Also, a pattern naming more than the command name ("Bash(git push *)")
      runs the hook on any $(), backtick or $VAR command.
    not_an_enforcement_mechanism: >
      "Because the `if` filter is best-effort, use the permission system rather
      than a hook to enforce a hard allow or deny." — hooks.md, "Common fields".
      SCOPE, because this sentence is easy to over-read: it argues against
      relying on `if` for gating, NOT against hooks in general. Hook-based
      denial via PreToolUse permissionDecision is documented and unqualified.
  args:
    applies_to: 'type: "command" only'
    effect: >
      Presence of `args` switches the handler to EXEC form: `command` is
      resolved as an executable on PATH and spawned directly with `args` as the
      argument vector. No shell — so no pipes, no &&, no globbing, and special
      characters pass through verbatim.
    absent_means: >
      Shell form. `command` goes to `sh -c` (macOS/Linux), Git Bash, or
      PowerShell.
    guidance: >
      The doc recommends exec form for any hook referencing a path placeholder
      (${CLAUDE_PROJECT_DIR}, ${CLAUDE_PLUGIN_ROOT}, ${CLAUDE_PLUGIN_DATA}),
      because each args element is passed as one argument with no quoting.
  shell:
    applies_to: 'type: "command" only'
    values: [bash, powershell]
    default: >
      "bash"; "powershell" on Windows when Git Bash is absent.
    ignored_when: args is set
  asyncRewake:
    applies_to: 'type: "command" only'
    implies: async
    effect: >
      Runs in the background and WAKES Claude on exit code 2, even when the
      session is idle. The hook's stderr — or stdout when stderr is empty — is
      shown to Claude as a system reminder.
    relation_to_async: >
      Plain `async` output waits for the next conversation turn; asyncRewake
      exit-2 is the documented exception to that wait.
  statusMessage:
    applies_to: all hook types
    effect: Custom spinner message shown to the USER while the hook runs.
    note: >
      Cosmetic. Does not reach the model, so it cannot substitute for
      additionalContext.
  once:
    effect: "If true, runs once per session then is removed."
    honored_only_in: skill frontmatter
    ignored_in: [settings.json, settings.local.json, agent frontmatter]
    note: >
      Recorded precisely because the ignore is silent. This repo declares no
      hooks in skill frontmatter (verified 2026-08-19), so `once` has nowhere
      to be honoured here today.
  command:
    note: "Shell command. Only `type: command` supports `async`."
  timeout:
    defaults:
      command: 600
      http: 600
      mcp_tool: 600
      prompt: 30
      agent: 60
    per_event_overrides:
      UserPromptSubmit: 30   # for command/http/mcp_tool
      MessageDisplay: 10
      SessionEnd: >
        1.5-second shared budget; longer timeouts raise it up to 60 seconds.
    on_timeout: >
      The hook is canceled, output is DISCARDED, and no decision is reported.
  async:
    default: false
    applies_to: 'type: "command" only'
    quote: >
      "By default, hooks block Claude's execution until they complete. For
      long-running tasks like deployments, test suites, or external API calls,
      set \"async\": true to run the hook in the background while Claude
      continues working. Async hooks can't block or control Claude's behavior:
      response fields like `decision`, `permissionDecision`, and `continue`
      have no effect, because the action they would have controlled has
      already completed." — hooks.md, section "Run hooks in the background".
    delivery: >
      "When the script finishes, its output is delivered on the next
      conversation turn."
    # See docs/06-Daily/reports/contrato-salida-hooks-2026-08-15.md §Async.
    # The doc names decision/permissionDecision/continue as inert. It does NOT
    # name additionalContext. What it DOES state is the delivery point ("the
    # next conversation turn") and, separately, that SubagentStart's
    # additionalContext lands "at the start of the conversation, before its
    # first prompt". Those two are unsatisfiable together: a hook that returns
    # after the subagent's conversation has begun cannot be inserted before its
    # first prompt. This manifest therefore records async-on-SubagentStart as
    # CONTRA-INDICATED rather than as documented-inert, and the distinction is
    # deliberate — see the report for what would settle it.
    contraindicated_for:
      - event: SubagentStart
        reason: >
          Insertion point is "before the first prompt"; async delivery is "the
          next conversation turn". Inference, not a quoted rule.
      - event: SessionStart
        reason: Same conflict — insertion point precedes the first prompt.
    contraindicated_for_prompt_coupled_context:
      - event: UserPromptSubmit
        reason: >
          Insertion point is "alongside the prompt being submitted"; async
          delivery is "the next conversation turn". A different category from
          the two entries above — there the insertion point PRECEDES the first
          prompt and nothing arrives at all — with the same consequence for the
          reader: the context lands one prompt late, attached to a turn that did
          not produce it. Applies only to hooks that emit additionalContext; a
          UserPromptSubmit hook with side effects only (capture, prefetch,
          budget warnings) is correctly async. Inference, not a quoted rule.
    self_documenting_requirement: >
      A hook's header comment stating "Async: false" while settings.json
      registers it with "async": true is a contract contradiction in the repo
      itself. The conformance test checks this pair.

# ── What this repo must not do ────────────────────────────────────────────────
prohibited_in_this_repo:
  - id: root-level-additional-context
    rule: >
      No hook may print a JSON object whose ROOT contains additionalContext.
      It is silently discarded by the host.
    detect: tests/contracts/test_claude_code_hooks_schema_conformance.py
  - id: header-registration-async-mismatch
    rule: >
      A hook's "# Async:" header comment must agree with its registration in
      .claude/settings.json.
    detect: tests/contracts/test_claude_code_hooks_schema_conformance.py
  - id: if-field-on-non-tool-event
    rule: >
      No handler may declare `if` on an event outside
      [PreToolUse, PostToolUse, PostToolUseFailure, PermissionRequest,
      PermissionDenied]. The host silently never runs it, producing a hook that
      exists in settings, exists on disk, and has zero telemetry rows — which
      reads as "dormant" rather than "misconfigured".
    current_state: >
      Zero handlers in this repo use `if` at all. Verified 2026-08-19 over the
      162 handlers in .claude/settings.json and the 200 entries in
      cognitive-os.yaml > harness.hooks; the only keys in use are
      type/command/async and script/event/scope/async/matcher/*_projection.
      This rule is therefore preventive, not remedial.
    detect: tests/contracts/test_claude_code_hooks_schema_conformance.py
    severity: advisory
  - id: once-field-in-settings
    rule: >
      `once: true` is ignored outside skill frontmatter. Writing it in
      .claude/settings.json or in agent frontmatter yields a hook that runs
      every time while its author believes it runs once.
    severity: advisory
  - id: decision-fields-on-context-only-events
    rule: >
      SubagentStart, SessionStart and Setup are context-only. Emitting
      permissionDecision on them is inert; it signals the author believed the
      event supports gating.
    severity: advisory
