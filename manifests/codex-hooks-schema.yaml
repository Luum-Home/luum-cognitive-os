schema_version: 1
harness: codex
description: >
  Published hook schema of the Codex harness, transcribed from upstream
  documentation. This manifest is the EXTERNAL contract: it records what Codex
  itself accepts, independent of what the Cognitive OS driver happens to emit.
  The conformance test validates driver output against THIS file, so a driver
  that agrees only with itself cannot pass.

  Companion manifest: manifests/harness-driver-capabilities.yaml records what
  the COS driver chooses to project (internal policy). When the two disagree,
  this file wins and the driver is the bug.

sources:
  - url: https://learn.chatgpt.com/docs/hooks
    what: Codex hooks reference — event list, matcher support, stdin payload,
      exit-code semantics, handler fields, trust requirement, y que campos
      estan "parsed but not supported yet".
    verified: 2026-08-19
    how: >
      curl -sL https://developers.openai.com/codex/hooks -o /tmp/codex-hooks.html
      (redirige 308 a https://learn.chatgpt.com/docs/hooks); el texto vive en el
      HTML pre-renderizado:
      grep -o 'permissionDecision[^<]*not supported yet[^<]*' /tmp/codex-hooks.html
  - url: https://github.com/openai/codex/blob/main/docs/config.md
    what: hooks.json file shape and handler field reference.
    verified: 2026-08-15
  - note: >
      Both sources were read by the operator on 2026-08-15 and transcribed here.
      Re-verify on the dates above before trusting a claim in a later session;
      when Codex changes, this file is the single place to update.

# ── File shape ────────────────────────────────────────────────────────────────
file:
  path: .codex/hooks.json
  # The top-level `hooks` namespace is MANDATORY. A file whose event keys sit at
  # the root is not parsed as hooks at all — the whole registration is inert.
  root_key: hooks
  root_key_required: true
  example: |
    {
      "hooks": {
        "PreToolUse": [
          {
            "matcher": "^Bash$",
            "hooks": [
              { "type": "command", "command": "...", "timeout": 30 }
            ]
          }
        ]
      }
    }

# ── Events ────────────────────────────────────────────────────────────────────
# matcher: required | optional | unsupported
#   unsupported  → emitting a "matcher" key for this event is a schema violation
#   matcher_semantics:
#     tool_name_regex  → regex evaluated against the tool name (Bash, apply_patch, mcp__*)
#     enum             → matcher must be one of `matcher_values`
#     subagent_type    → free-form subagent type name
events:
  SessionStart:
    cadence:
      fires_when: >-
        Cuando arranca la sesion. La doc lo agrupa bajo 'When a session or
        subagent starts', separado del grupo 'During a turn'.
      per_session: exactly-1-per-session
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        When a session or subagent starts SessionStart, SubagentStart
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
    matcher: optional
    matcher_semantics: enum
    matcher_values: [startup, resume, clear, compact]
    can_block: false
  SubagentStart:
    cadence:
      fires_when: >-
        Cuando arranca un subagente. Mismo grupo de la doc que SessionStart, pero
        la unidad es el SUBAGENTE: N por sesion.
      per_session: 0-N-per-subagent
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        When a session or subagent starts SessionStart, SubagentStart
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
    matcher: optional
    matcher_semantics: subagent_type
    can_block: false
  UserPromptSubmit:
    cadence:
      fires_when: >-
        Cuando el usuario envia un prompt. La doc lo lista dentro del grupo
        'During a turn', o sea una vez por turno.
      per_session: 0-N-per-turn
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        During a turn PreToolUse, PermissionRequest, PostToolUse, PreCompact,
        PostCompact, UserPromptSubmit, SubagentStop, Stop
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
    matcher: unsupported
    can_block: true
  PreToolUse:
    cadence:
      fires_when: >-
        Antes de cada llamada a herramienta, dentro del turno. Unidad: el
        tool-call.
      per_session: 0-N-per-tool-call
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        During a turn PreToolUse, PermissionRequest, PostToolUse, PreCompact,
        PostCompact, UserPromptSubmit, SubagentStop, Stop
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
    matcher: optional
    matcher_semantics: tool_name_regex
    can_block: true
    payload_extra: [tool_name, tool_use_id, tool_input]
  PermissionRequest:
    cadence:
      fires_when: >-
        Cuando una llamada a herramienta necesita decision de permiso. Unidad: el
        tool-call, y solo los que piden permiso — subconjunto estricto de
        PreToolUse.
      per_session: 0-N-per-tool-call
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        During a turn PreToolUse, PermissionRequest, PostToolUse, PreCompact,
        PostCompact, UserPromptSubmit, SubagentStop, Stop
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
    matcher: optional
    matcher_semantics: tool_name_regex
    can_block: true
    payload_extra: [tool_name, tool_use_id, tool_input]
  PostToolUse:
    cadence:
      fires_when: >-
        Despues de cada llamada a herramienta, dentro del turno. Unidad: el
        tool-call.
      per_session: 0-N-per-tool-call
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        During a turn PreToolUse, PermissionRequest, PostToolUse, PreCompact,
        PostCompact, UserPromptSubmit, SubagentStop, Stop
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
    matcher: optional
    matcher_semantics: tool_name_regex
    # `block` does NOT undo the tool call: it replaces the result with feedback.
    can_block: true
    block_semantics: replaces_result_with_feedback
    payload_extra: [tool_name, tool_use_id, tool_input]
  PreCompact:
    cadence:
      fires_when: >-
        Antes de compactar. Unidad: la compactacion; la mayoria de las sesiones no
        compacta.
      per_session: 0-N-per-compaction
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        During a turn PreToolUse, PermissionRequest, PostToolUse, PreCompact,
        PostCompact, UserPromptSubmit, SubagentStop, Stop
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
    matcher: optional
    matcher_semantics: enum
    matcher_values: [manual, auto]
    can_block: false
  PostCompact:
    cadence:
      fires_when: >-
        Despues de compactar. Unidad: la compactacion. NO tiene equivalente en
        Claude Code, que solo publica PreCompact.
      per_session: 0-N-per-compaction
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        During a turn PreToolUse, PermissionRequest, PostToolUse, PreCompact,
        PostCompact, UserPromptSubmit, SubagentStop, Stop
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
    matcher: optional
    matcher_semantics: enum
    matcher_values: [manual, auto]
    can_block: false
  SubagentStop:
    cadence:
      fires_when: >-
        Cuando TERMINA un subagente. Unidad: el subagente, no el turno ni la
        sesion: N por sesion, uno por cada subagente que se haya lanzado.
      per_session: 0-N-per-subagent
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        During a turn PreToolUse, PermissionRequest, PostToolUse, PreCompact,
        PostCompact, UserPromptSubmit, SubagentStop, Stop
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
    matcher: optional
    matcher_semantics: subagent_type
    can_block: false
  Stop:
    cadence:
      fires_when: >-
        Cuando termina el TURNO del hilo principal — no la sesion. La doc lo
        agrupa explicitamente bajo 'During a turn', y el payload lo confirma campo
        por campo: turn_id es el id del turno activo y stop_hook_active dice si
        ESTE turno ya fue continuado por un hook de Stop. El evento que si marca
        fin de sesion en Codex es SessionEnd, que este repo NO proyecta.
      per_session: 0-N-per-turn
      evidence: documented
      basis: [https://learn.chatgpt.com/docs/hooks]
      doc_quote: >-
        turn_id string Codex-specific extension. Active Codex turn id
        stop_hook_active boolean Whether this turn was already continued by Stop
      how: "curl -sSL https://learn.chatgpt.com/docs/hooks | grep -o 'When Hooks During a turn[^<]*'"
      blind_reason: >-
        Este repo NO corre sobre Codex: hay cero filas de telemetria propia de
        este arnes (.cognitive-os/metrics/hook-timing.jsonl es del wrapper de
        Claude Code). La clase sale de la tabla de ciclo de vida de la doc
        upstream, no de una medicion nuestra, y asi queda escrito.
      note: >-
        Misma cadencia que Stop en Claude Code. La coincidencia se verifico, no se
        asumio: la doc de Codex lo pone en el grupo 'During a turn' y le da un
        turn_id propio.
    matcher: unsupported
    can_block: true

# ── Handler object fields ─────────────────────────────────────────────────────
handler:
  required_fields: [type, command]
  allowed_fields: [type, command, commandWindows, timeout, statusMessage, async]
  type_values: [command]           # only "command" actually runs
  timeout:
    unit: seconds
    default: 600
  async:
    supported: false
    note: >
      Parsed by Codex but NOT honoured — a handler marked async runs
      synchronously anyway. Emitting it is a false promise of non-blocking
      behaviour, so the COS driver does not emit it.

# ── Tool names reachable by a tool_name_regex matcher ─────────────────────────
tool_names:
  - name: Bash
    tool_input_field: command
  - name: apply_patch
    tool_input_field: command
    note: >
      Codex's single file-mutation tool. It is the ONLY route to write-side
      guards; the Claude Code matchers Edit / Write / MultiEdit have no Codex
      equivalent and must be mapped here or write coverage is zero.
  - name_pattern: "mcp__*"
    note: MCP tools are matchable by the same regex mechanism.

# ── stdin payload delivered to every hook ─────────────────────────────────────
stdin_payload:
  always: [session_id, transcript_path, cwd, hook_event_name, model, permission_mode]
  turn_scoped_extra: [turn_id]

# ── Blocking contract ─────────────────────────────────────────────────────────
blocking:
  exit_code: 2
  exit_code_feedback_stream: stderr
  json_stdout_alternative:
    hookSpecificOutput:
      hookEventName: "<event>"
      permissionDecision: deny
      permissionDecisionReason: "<reason>"
  legacy_block_shape:
    decision: block
    reason: "<reason>"
    note: >
      Codex acepta explicitamente esta forma vieja ademas de la de
      hookSpecificOutput. Cita: "Codex also accepts this older block shape".

  # ── Lo que Codex PARSEA PERO NO IMPLEMENTA ───────────────────────────────
  # Esto no es un detalle de estilo: es el peor modo de falla de una guarda.
  # Un hook que pide confirmacion NO frena nada; Codex marca la corrida como
  # fallida, reporta el error y DEJA CORRER la tool call. El operador nunca ve
  # la pregunta. Falla abierto, y en silencio.
  parsed_but_not_supported_yet:
    verified: 2026-08-19
    source_url: https://learn.chatgpt.com/docs/hooks
    how: >
      grep -o 'permissionDecision[^<]*not supported yet[^<]*' sobre el HTML de
      https://learn.chatgpt.com/docs/hooks (ver `sources`).
    upstream_quote: >
      permissionDecision: "ask", legacy decision: "approve", continue: false,
      stopReason, and suppressOutput are parsed but not supported yet. Codex
      marks the hook run as failed, reports the error, and continues the tool
      call.
    fields:
      - permissionDecision: ask
      - decision: approve
      - continue: false
      - stopReason
      - suppressOutput
    failure_mode: fail_open_silently
    applies_to_events: [PreToolUse, PermissionRequest]
    consequence_for_cos: >
      Ninguna guarda de COS puede depender de `ask` para gobernar Codex. La
      unica senal que Codex honra hoy es exit 2 + stderr, o
      permissionDecision: deny / decision: block. `exit 2` SI bloquea: es la
      via documentada ("You can also use exit code 2 and write the blocking
      reason to stderr"), asi que las guardas que solo usan exit code NO estan
      expuestas a este agujero.
    post_tool_use_variant: >
      En PostToolUse, `updatedMCPToolOutput` y `suppressOutput` tienen el mismo
      trato: hook fallido + "continues normal processing of the tool result".

# ── Trust gate ────────────────────────────────────────────────────────────────
trust:
  required: true
  # Upstream wording: non-managed command hooks require trust before running.
  applies_to: non_managed_command_hooks
  operator_action: "/hooks"
  effect_until_trusted: hooks_do_not_run
  managed_exception:
    file: requirements.toml
    note: Managed hooks declared via requirements.toml are trusted automatically.
  installer_obligation: >
    Any installer that writes .codex/hooks.json MUST tell the operator that the
    hooks are inert until the .codex/ layer is trusted. A silent install that
    leaves every guard off is worse than not installing.

# ── Known COS projection gaps (driver-side, not schema-side) ──────────────────
# Recorded here so they are visible next to the contract they fall short of.
known_projection_gaps:
  - id: session-start-matcher-startup-only
    detail: >
      The driver emits matcher "startup" for SessionStart, so resumed, cleared
      and compacted sessions get no SessionStart hooks. Widening this is an
      operator decision, not a bug fix — it changes how often ~27 hooks fire.
  - id: no-permission-request-projection
    detail: PermissionRequest is a valid Codex event with no COS hook mapped to it.
  - id: no-compact-projection
    detail: >
      PreCompact exists in the canonical registry but is not projected to Codex;
      PostCompact has no COS equivalent event at all.
  - id: no-subagent-projection
    detail: >
      SubagentStart / SubagentStop are valid Codex events; the COS registry has
      one SubagentStart hook that is not projected.
