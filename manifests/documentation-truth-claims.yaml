schema_version: documentation-truth-claims.v1
owner_adr: ADR-277
purpose: >-
  Declare documentation claims whose truth is derived from generated reports or
  manifests, so stale or contradictory prose cannot silently persist after the
  underlying implementation changes.
status_policy:
  pass: all required docs, phrases, source reports, and generated blocks match current facts
  warn: advisory-only claim has weak evidence but no contradiction
  block: required claim is missing, contradicted, or backed by a missing/stale source report
source_reports:
  consumer_projection:
    path: docs/06-Daily/reports/primitive-projection-fidelity-latest.json
    required: true
  primitive_authority:
    path: docs/06-Daily/reports/primitive-authority-latest.json
    required: true
  volatile_numbers:
    path: docs/06-Daily/reports/volatile-numbers-latest.json
    required: false
  acc:
    path: docs/07-Capabilities/acc/latest.json
    required: false
forbidden_phrase_scan:
  purpose: >-
    A forbidden phrase is searched across this declared surface, not inside the
    claim's own required_docs. The old behaviour searched required_docs only, so
    a claim without them checked ZERO files and passed: on 2026-08-19 the phrase
    "the canonical hook registry is cognitive-os.yaml > harness.hooks" was
    declared forbidden with no required_docs, the audit went green, and three
    live copies kept shipping the lie into every sub-agent prompt (a .md, a .sh
    and a .py docstring). Every forbidden_phrase row now reports the number of
    files it was checked against, because N=0 was the defect.
  matching: >-
    Phrase, not substring. Atoms are matched literally, separated by whitespace
    and by markdown/rst decoration (backticks, quotes, asterisks, underscores),
    so the same sentence is caught bare, in `single backticks` and in ``double``
    ones -- the declared phrase carried backticks and the two live copies did
    not, so a literal match would have found neither. Boundaries reject
    word-ish neighbours including hyphen and slash, so "plan-only Claude/Codex"
    does not match the phrase "only Claude/Codex".
  include_suffixes: [.md, .sh, .py, .yaml, .yml]
  prune_dirs:
    - .git
    - .venv
    - venv
    - node_modules
    - reference
    - .cognitive-os
    - __pycache__
    - .pytest_cache
    - .mypy_cache
    - .ruff_cache
    - dist
    - build
    - target
    - .worktrees
    - htmlcov
  prune_reason: >-
    Version-control internals, virtualenvs, vendored third-party trees
    (reference/), build output, tool caches, and .cognitive-os runtime state
    plus rotated telemetry. None of them is repo prose an agent or a reader is
    served, and together they are most of the bytes on disk.
  skip_date_anchored: true
  historical_adr_statuses: [superseded, deprecated, rejected, withdrawn]
  historical_reason: >-
    A citation of a lie is not the lie. Any file whose NAME carries a YYYY-MM-DD
    stamp is a dated record -- session reports, handoffs, checklists -- and
    quotes the state of that day on purpose; flagging them would be a mass false
    positive and the fastest way to get the gate switched off. Same for an ADR
    whose frontmatter status is superseded/deprecated/rejected/withdrawn: a
    superseded decision keeps its original prose by design.
  exclude_globs:
    - glob: docs/06-Daily/reports/**
      reason: >-
        Session reports (date-anchored) and the generated *-latest ledgers.
        Historical record and machine output, not asserted current truth. A
        report that a claim needs scanned anyway is opted back in by naming it
        in that claim's required_docs, which are always scanned.
    - glob: tests/**
      reason: >-
        The instrument's own fixtures and assertions. A stale-phrase test must
        contain the phrase to assert its absence
        (tests/contracts/test_primitive_authority_docs.py lists three of them).
        The alternative is deforming test code so the auditor is not confused,
        which is the tail wagging the dog.
    - glob: packages/*/tests/**
      reason: same as tests/**, reached through the package layout instead of the symlink.
    - glob: .claude/plugins/**
      reason: third-party plugin cache, vendored, not authored in this repo.
    - glob: "**/archive/**"
      reason: archived artifacts are a record of what was, not a claim about what is.
    - glob: "**/archived/**"
      reason: archived artifacts are a record of what was, not a claim about what is.
    - glob: "**/CHANGELOG*.md"
      reason: release history quotes the state of each release on purpose.
    - glob: rules/session-close-doc-truth.md
      reason: >-
        The rule that DEFINES this discipline teaches it by quoting an example
        forbidden phrase ("no atomic close primitive exists"). Self-reference,
        same class as the claims manifest and the auditor -- both of which the
        audit excludes in code rather than by configuration.
  known_blind_spots: >-
    Semantic inversion is invisible to phrase matching: "not only Claude/Codex"
    contains "only Claude/Codex" and means the opposite. Today the only instance
    lives in tests/, already excluded; a future one in live prose would be a
    false positive and must be fixed by making the phrase more specific, never
    by adding the file to exclude_globs. Growth of exclude_globs is itself the
    smell to watch: it should change when a path CLASS changes, not when a false
    positive appears.
claims:
  volatile_number_prose:
    severity: medium
    description: >-
      Documentation prose must not publish primitive census counts (hooks, rules,
      skills, ADRs, lib modules, tests) as current state. A census count belongs to
      the command that produces it or to a declared claim; hardcoded in prose it is
      wrong the day after it is written. Historical observations (date-anchored),
      contract constants, third-party counts and quoted samples are exempt.
    facts:
      detector: scripts/volatile_number_audit.py
      baseline: manifests/volatile-number-baseline.json
      ratchet: baseline may only shrink; raising it to silence a red is prohibited
    source_reports:
      - docs/06-Daily/reports/volatile-numbers-latest.json
    required_docs:
      - docs/06-Daily/reports/numeros-volatiles-2026-08-15.md
    required_phrases:
      - The prose says how to know it, not how many
    forbidden_phrases:
      - "Component counts: 57 hooks, 55 rules, 72 skills"
  claude_code_hook_registration:
    severity: high
    description: >-
      Documentation must not claim that cognitive-os.yaml > harness.hooks is the
      registry the Claude Code driver reads. It is not. The bare, codex and
      opencode drivers do read the yaml; scripts/_lib/settings-driver-claude-code.sh
      holds its registry hardcoded as shell literals, and its own header says so
      after CONFIG_FILE was found assigned and never read once. The consequence is
      not cosmetic: a hook registered only in the yaml exists, never fires, and
      nothing reports it. The claim mattered enough to earn a ledger entry because
      it was injected into every sub-agent prompt through
      templates/project-gotchas.md, so every agent of 2026-08-19 was told the wrong
      way to register a hook, and at least one followed it. Origin, established
      2026-08-20: the driver never read the yaml. CONFIG_FILE was a dead
      assignment in 387c9fc56, the very commit that implemented ADR-064 and whose
      message claims "Reads harness.hooks" -- so the claim stood for 111 days
      without a decision behind it. The first version of this claim declared a
      single backticked literal as its forbidden phrase and matched nothing while
      three live copies existed (cognitive-os.yaml's own block header,
      cos_lib/wiring_validator.py's remediation text, ADR-064.synthesis.md); the
      phrase list below is what those copies actually said.
    facts:
      driver: scripts/_lib/settings-driver-claude-code.sh
      surfaces_for_one_hook: 6
      how_to_verify: >-
        grep -c '<hook>' cognitive-os.yaml
        scripts/_lib/settings-driver-claude-code.sh scripts/apply-efficiency-profile.sh
        templates/security-profiles/*.json -- a hook that fires is present in all six
      live_orphan: hooks/publication-safety.sh
    required_docs:
      - scripts/_lib/settings-driver-claude-code.sh
      - hooks/inject-phase-context.sh
      - templates/project-gotchas.md
      - cognitive-os.yaml
      - cos_lib/wiring_validator.py
      - docs/02-Decisions/adrs/ADR-064-harness-agnostic-cognitive-os.md
      - docs/02-Decisions/adrs/ADR-064.synthesis.md
    required_phrases:
      - Claude Code is the exception
      - IT IS NOT THE REGISTRATION FOR CLAUDE CODE
      - has never read this block
    forbidden_phrases:
      - "the canonical hook registry is `cognitive-os.yaml > harness.hooks`"
      - Single source of truth for all hook registrations
      - project this block into harness-native configs
      - "in cognitive-os.yaml > harness.hooks, then run"
  consumer_projection_harnesses:
    severity: high
    description: Consumer projection docs must describe current implemented native and structural harnesses, not the old Claude/Codex-only boundary.
    facts:
      harnesses_from: manifests/harness-projection.yaml
      projection_report: docs/06-Daily/reports/primitive-projection-fidelity-latest.json
    source_reports:
      - docs/06-Daily/reports/primitive-projection-fidelity-latest.json
      - docs/06-Daily/reports/primitive-readiness-ledger-scripts-latest.json
    required_docs:
      - docs/04-Concepts/architecture/consumer-project-primitive-accessibility.md
      - docs/02-Decisions/adrs/ADR-146-primitive-readiness-ledger.md
    required_phrases:
      - Structural projection is not runtime enforcement
      - implemented native and structural harnesses
    forbidden_phrases:
      - proof signs only Claude Code and OpenAI Codex default installs
      - automated for Claude/Codex default installs
      - current Claude/Codex proof boundary
      - solo Claude/Codex
      - only Claude/Codex
    generated_block:
      doc: docs/04-Concepts/architecture/consumer-project-primitive-accessibility.md
      marker: consumer_projection_harnesses
      required: true
  primitive_authority_write_effects:
    severity: high
    description: Authority docs must describe the implemented ADR-276 authority/write-effects audit and latest report, not a pending gap.
    facts:
      authority_report: docs/06-Daily/reports/primitive-authority-latest.json
      manifest: manifests/primitive-authority.yaml
    source_reports:
      - docs/06-Daily/reports/primitive-authority-latest.json
    required_docs:
      - docs/04-Concepts/architecture/primitive-authority-write-effects.md
      - docs/02-Decisions/adrs/ADR-276-primitive-authority-write-effects.md
    required_phrases:
      - manifests/primitive-authority.yaml
      - scripts/primitive_authority_audit.py
      - authority_write_effects
      - dynamic write-effects audit
    forbidden_phrases:
      - Known remaining gap
      - falta una capa explícita de authority/write-effects audit
      - no is documentado todavia
      - phrase: not implemented yet
        scope:
          - docs/04-Concepts/architecture/primitive-authority-write-effects.md
          - docs/02-Decisions/adrs/ADR-276-*.md
        scope_reason: >-
          Generic English, not a claim signature. Repo-wide it matches 14 places
          that have nothing to do with authority/write-effects (ADR-225, ADR-234,
          ADR-236, ADR-264, release-signing.md, scripts/audit_adrs.py...), where
          it describes some other unrelated thing as pending. Coincidence, not
          debt: a change in the authority audit should not force an edit to any
          of them. Narrowed to the two surfaces this claim is about.
    generated_block:
      doc: docs/04-Concepts/architecture/primitive-authority-write-effects.md
      marker: primitive_authority_write_effects
      required: true
  documentation_truth_control:
    severity: medium
    description: Documentation truth control itself must remain discoverable and wired into ACC.
    facts:
      manifest: manifests/documentation-truth-claims.yaml
      report: docs/06-Daily/reports/documentation-truth-latest.json
    source_reports:
      - docs/06-Daily/reports/documentation-truth-latest.json
    required_docs:
      - docs/04-Concepts/architecture/documentation-truth-control.md
      - docs/02-Decisions/adrs/ADR-277-documentation-truth-control.md
      - docs/00-MOCs/entrypoints/README.md
    required_phrases:
      - documentation_truth
      - documentation-truth-claims.yaml
      - documentation_truth_audit.py
    forbidden_phrases: []
    generated_block:
      doc: docs/04-Concepts/architecture/documentation-truth-control.md
      marker: documentation_truth_control
      required: true
  session_pending_protocol:
    severity: high
    description: >-
      Session-pending protocol primitives (ADR-273/274/275) — aggregator,
      verifier, audit, projector, close primitives, drift hooks, trust signal
      — must remain discoverable in the operations MOC, the architecture
      doc, and the ADR §Related sections. Stale phrases describing the
      read/write asymmetry as unresolved must not persist.
    facts:
      pending_truth_report: docs/06-Daily/reports/pending-truth-latest.json
      operational_guide_report: docs/06-Daily/reports/operational-guide-audit-latest.json
      closure_trust_report: docs/06-Daily/reports/closure-trust-baseline.json
      doc_xref_audit: scripts/cos-doc-cross-reference-audit.py
      architecture_map: docs/04-Concepts/architecture/pending-truth-architecture.md
    source_reports:
      - docs/06-Daily/reports/pending-truth-latest.json
      - docs/06-Daily/reports/operational-guide-audit-latest.json
    required_docs:
      - docs/00-MOCs/operations.md
      - docs/04-Concepts/architecture/pending-truth-architecture.md
      - docs/02-Decisions/adrs/ADR-273-pending-truth-ledger-and-bilateral-verification.md
      - docs/02-Decisions/adrs/ADR-274-operational-guide-required-for-capability-adrs.md
      - docs/02-Decisions/adrs/ADR-275-closure-and-projection-primitives.md
      - skills/CATALOG.md
      - skills/CATALOG-COMPACT.md
    required_phrases:
      - cos-pending-truth-aggregator
      - cos-pending-truth-close
      - cos-adr-close
      - cos-session-start-projector
      - cos-closure-trust-signal
      - session-pending-brief
      - session-pending-close
      - STATUS-TAXONOMY
      - pending-truth-architecture.md
      - closure-trail.jsonl
    forbidden_phrases:
      - read/write asymmetry remains unresolved
      - no atomic close primitive exists
      - manual closures are the only path
      - session-start surfaces only Engram and plans
      - projector is not yet wired into the harnesses
      - cos-pending-truth-close does not exist
      - cos-adr-close is a future follow-up
      - closure-trail is not implemented
    generated_block:
      doc: docs/04-Concepts/architecture/pending-truth-architecture.md
      marker: session_pending_protocol
      required: false
  subprocess_timeout_discipline:
    severity: medium
    description: >-
      subprocess.run timeout discipline (ADR-278) must remain documented;
      the audit, allowlist, and test-conftest safety net must be
      discoverable in their canonical locations.
    facts:
      audit_report_command: scripts/cos-subprocess-timeout-audit.py
      allowlist: manifests/subprocess-timeout-allowlist.yaml
      test_default: tests/conftest.py
    source_reports:
      - manifests/subprocess-timeout-allowlist.yaml
    required_docs:
      - docs/02-Decisions/adrs/ADR-278-subprocess-run-timeout-discipline.md
    required_phrases:
      - cos-subprocess-timeout-audit.py
      - subprocess-timeout-allowlist.yaml
      - COS_TEST_SUBPROCESS_DEFAULT_TIMEOUT
      - subprocess.run
      - timeout=
    forbidden_phrases:
      - untimed subprocess calls are harmless
      - pytest-timeout always kills hung subprocesses
      - the timeout keyword is optional in production
    generated_block:
      doc: docs/02-Decisions/adrs/ADR-278-subprocess-run-timeout-discipline.md
      marker: subprocess_timeout_discipline
      required: false
  payload_canary_determinism:
    severity: medium
    description: >-
      The payload field canary runs in the test suite against an in-repo
      redacted corpus, with a ratchet on phantom field dependencies. Docs must
      not keep claiming it can only run against live transcripts.
    facts:
      corpus: tests/fixtures/payload-corpus/harness-payloads.jsonl
      capture_command: scripts/capture_payload_corpus.py
      canary_command: scripts/audit_payload_field_contracts.py --canary
      ratchet_test: tests/audit/test_payload_field_contracts.py
    required_docs:
      - docs/06-Daily/reports/payload-contract-architecture-2026-08-15.md
      - tests/fixtures/payload-corpus/README.md
    required_phrases:
      - tests/fixtures/payload-corpus
      - --canary --live
    forbidden_phrases:
      - necesita transcripts, no corre en CI
      - el canario no puede ser determinista
  cos_init_flag_surface:
    severity: medium
    description: >-
      Install documentation must describe cos-init.sh flags as the parser
      actually implements them: --default and --full are the only two effective
      profiles, and --minimal/--standard/--lean parse successfully but remap to
      --default (ADR-093). Two failure modes are forbidden — claiming the legacy
      flags are unparsed or nonexistent (they parse), and presenting them as
      three distinct profiles (there are two). The claim exists because both the
      commit message of 958845a18 and the first version of the carga-cognitiva
      report asserted the flags did not parse, on the strength of a grep against
      scripts/cos-init.sh, which is a 15-line shim; the parser is in
      scripts/cos_init.py.
    facts:
      shim: scripts/cos-init.sh
      parser: scripts/cos_init.py
      verify_command: bash scripts/cos-init.sh --help
      effective_profiles: "--default, --full"
      legacy_aliases: "--minimal, --standard, --lean -> --default"
    required_docs:
      - docs/00-MOCs/entrypoints/getting-started.md
      - docs/00-MOCs/entrypoints/quickstart.md
      - docs/06-Daily/reports/install-doors-forensics-2026-08-15.md
    required_phrases:
      - remap to `--default`
      - Two install profiles exist, not three
    forbidden_phrases:
      - parses no such flags
      - flags scripts/cos-init.sh does not parse
      - Esos flags no

  disk_ceiling_single_source:
    severity: medium
    description: >-
      The .cognitive-os disk ceiling has exactly one source of truth, the
      global_budget block in manifests/state-retention.yaml, and every consumer
      reads it rather than restating the number. Two failure modes are forbidden:
      hardcoding the figure in a test or script, and describing a ceiling that
      nothing measures the total against.

      The claim exists because both happened at once. tests/contracts/test_ram_ceiling.py
      hardcoded 400 while its own docstring said "default 200" -- the file
      contradicted itself, and neither figure was derived from anything. And
      state_retention_audit.py reported findings=0 while the tree was over the
      ceiling, because it checked each surface against its own cap and never summed
      them against the global one it documented. A ceiling nothing sums to is prose,
      not a budget.

      Two properties are load-bearing and easy to lose. The total covers ALL of
      .cognitive-os, not only registered surfaces: summing the 14 registered ones
      gives 183 MiB against 400, a permanent green that would hide the 208 MiB
      living outside any surface. And the measurement is allocated blocks, matching
      what the gate reads; apparent size differed by 39 MiB on 2026-08-18, about
      10% of the ceiling, which is enough for the audit to pass a commit the gate
      fails.
    facts:
      source_of_truth: manifests/state-retention.yaml
      key: global_budget.max_total_mib
      env_override: COS_VITALS_DISK_CEILING_MIB
      measurement: allocated-blocks
      auditor: scripts/state_retention_audit.py
      gate: tests/contracts/test_ram_ceiling.py
      verify_command: python3 scripts/state_retention_audit.py
      observed_2026_08_18: 392.1 MiB used of 400.0 (183.6 registered, 208.5 unregistered)
    required_docs:
      - docs/06-Daily/reports/retention-techo-global-2026-08-18.md
  test_environment_contract:
    severity: high
    description: >-
      A dependency declaration with no consumer is not a missing dependency. The
      `testing` extra of packages/agent-service/pyproject.toml has declared httpx
      since 2026-05-20; no install path in this repo reads that file (setup.sh and
      cos-update.sh operate on the root, CI runs `uv sync --extra testing --locked`
      on the root), and pytest.ini declares `testpaths = tests`, so those 7 tracked
      files and their 36 test functions are never collected either. Two stacked
      disconnections, discovered three months later as a collection-time
      ModuleNotFoundError. Documentation must not state that running the tests
      under `tests/` covers every versioned test in the repo: it covers the surface
      declared in testpaths, and the census names the difference.
    facts:
      census: scripts/audit_test_import_resolvability.py
      gate: tests/contracts/test_test_import_resolvability.py
      exceptions: manifests/test-import-exceptions.yaml
      verify_command: python3 scripts/audit_test_import_resolvability.py --gate
      population_2026_08_20: 2319 tracked test files
      module_level_unresolvable_2026_08_20: 1 file in 1 directory
      declared_nowhere_2026_08_20: 0
      blind_2026_08_20: 43 (40 first-party via sys.path, 3 function-body imports)
    required_docs:
      - docs/06-Daily/reports/tests-que-no-corren-donde-viven-2026-08-20.md
      - manifests/test-import-exceptions.yaml
    required_phrases:
      - una declaración de dependencias sin consumidor no es una dependencia faltante
    forbidden_phrases:
      - "pytest tests/ corre todos los tests versionados del repo"
  session_start_projection_counts:
    severity: high
    description: >-
      Every count the ADR-275 session-start projector prints must stay inside
      the universe its label names. `control_plane.open_findings` counts
      `status: active` entries in the audit state machine, never rows of the
      append-only remediation log (until 2026-08-21 it printed 119034 log rows
      under an open-findings label, over ~5.2k distinct findings); P0/P1 are
      null when the source report carries no `priority` field; the staged
      count is directories matching *staging*, with deployment unverified.
    facts:
      projector: scripts/cos-session-start-projector
      gate: scripts/projector_count_sanity.py
      probes: tests/red_team/portability/test_projector_count_sanity.py
      open_findings_authority: .cognitive-os/runtime/control-plane-audit/findings-state.json
      proposal_log: .cognitive-os/tasks/control-plane-remediation.jsonl
    required_docs:
      - docs/02-Decisions/adrs/ADR-275-closure-and-projection-primitives.md
      - docs/06-Daily/reports/el-conteo-que-encabeza-el-brief-2026-08-21.md
    required_phrases:
      - Counting contract
      - queue_event_rows
      - open_findings_known
    forbidden_phrases:
      - open findings is the remediation log row count
    executable_assertions:
      - id: projector_counts_stay_inside_their_universe
        claim: 'Each projector count is bounded by the universe recomputed from its
          source: open findings <= distinct findings in the remediation log and <=
          findings tracked by the audit state machine, the pending-truth totals match
          the ledger, P0/P1 are null while the source has no priority field, and the
          staged count matches the directories on disk. The gate exits 1 the moment a
          count is off by an order of magnitude.'
        command:
        - bash
        - -c
        - |
          set -u
          python3 scripts/projector_count_sanity.py || exit 1
          echo "projector counts within their declared universes"
        surface:
        - scripts/cos-session-start-projector
        - scripts/projector_count_sanity.py
        expect:
          exit_code: 0
        next_action: run `python3 scripts/projector_count_sanity.py --json` and fix the
          reported count in scripts/cos-session-start-projector -- never widen the gate
  agent_channel_facts:
    severity: high
    description: 'The two files the SubagentStart injector concatenates reach EVERY sub-agent before its
      first tool call, unconditionally, so a false sentence there is read by 100% of agents. On 2026-08-20
      a read-only judge verified 57 of the channel''s claims: 15 were false, 41 of the 42 correct ones were
      verifiable by script, and zero were automated. Phrase lists cannot catch this family: ''42 of 256
      hooks/*.sh are symlinks'' is not stale prose, it is a measurement the repo invalidates on its own.
      The checks below run the command and compare its OUTPUT against the sentence -- the number is true
      iff the command still prints it.'
    facts:
      channel: SubagentStart -> hooks/subagent-context-injector.sh
      judged: docs/06-Daily/reports/juicio-lo-que-el-so-le-dicta-a-sus-agentes-2026-08-20.md
      budget_gate: tests/contracts/test_canal_al_subagente_tiene_margen.py
      not_covered: Channel B (hooks/inject-phase-context.sh) and B-prime (templates/project-gotchas.md)
        are conditional on prompt keywords and their census numbers were measured stale on 2026-08-20 (C1,
        C3, C10 of the judgement). Declaring them here today would either turn the gate red or force the
        numbers to be laundered; they get their own assertions once the correcting pass lands.
    path_claims:
      reason: 'Three of the channel''s false sentences were never stale, they were never true: a quoted
        path that does not exist (lib/agent_output_extractor.py). Every repo path the channel quotes must
        resolve today, symlinks followed.'
      docs:
      - templates/agent-mandatory-rules.md
      - templates/agent-preamble.md
      ignore: []
    executable_assertions:
    - id: hook_symlink_method
      claim: The channel no longer publishes a symlink COUNT -- it publishes the METHOD, because a
        figure rots on its own and a method does not. What must stay true is the premise of that method --
        that `find -type l` recurses and a `for f in dir/*` loop does not. That premise is what made
        an audit publish "tests/ has ZERO" while two lived under tests/unit/, and it is the only part
        of the sentence that can become false.
      command:
      - bash
      - -c
      - 'r=$(find tests -type l | wc -l | tr -d " "); s=0; for f in tests/*; do [ -L "$f" ] && s=$((s+1)); done; [ "$r" -gt "$s" ] && echo "a \`for f in dir/*\` loop does NOT recurse" || echo "METHOD CLAIM BROKEN"'
      expect:
        stdout_phrase_in:
        - templates/agent-mandatory-rules.md
      next_action: if this breaks, the channel's advice about how to count symlinks is wrong and the
        sentence must be rewritten -- not the assertion
    - id: tests_symlink_locations
      claim: The channel no longer publishes a symlink COUNT for tests/ -- it publishes WHERE they
        live, "in hooks/ and under tests/unit/". Una cifra se pudre sola; una ubicacion solo cambia
        si alguien mueve el archivo. La version anterior de esta asercion exigia el numero, y cuando
        un agente reemplazo la cifra por el metodo la asercion quedo custodiando una frase que ya no
        existia -- verde imposible, rojo permanente, y el instrumento acusando al canal de haber
        mejorado. Lo que se verifica ahora es la ubicacion, que es lo que el canal afirma.
      command:
      - bash
      - -c
      - 'h=$(find hooks -maxdepth 1 -type l | wc -l | tr -d " "); u=$(find tests/unit -type l 2>/dev/null | wc -l | tr -d " "); [ "$h" -gt 0 ] && [ "$u" -gt 0 ] && echo "in \`hooks/\` and under \`tests/unit/\`" || echo "SYMLINK LOCATIONS CHANGED"'
      expect:
        stdout_phrase_in:
        - templates/agent-mandatory-rules.md
      next_action: si esto rompe, los symlinks se movieron y la frase del canal quedo falsa para
        todo agente. Reescribi la frase con las ubicaciones reales -- no la asercion.
    - id: blocking_hook_actually_blocks
      claim: 'The channel tells every agent that `rm`+`ln -s` with a relative target under a directory
        symlink IS blocked. A claim that a hook BLOCKS is only verifiable by running the hook: the 2026-08-20
        judgement declared this sentence false on the strength of `grep -c symlink-mutation-guard .claude/settings.json`
        returning 0, and the warning was deleted from the channel. The hook does block -- it runs from
        hooks/bash-hot-path-dispatcher.sh, which is the registered entry. This probe feeds the incident
        payload on stdin and demands exit 2, and feeds an innocent command and demands exit 0, so neither
        half can rot unseen: a guard that stops blocking AND a guard that starts blocking everything both
        turn this red.'
      command:
      - bash
      - -c
      - 'set -u; unset COS_ALLOW_SYMLINK_MUTATION COS_BYPASS COS_ALLOW_PROTECTED_CONFIG_WRITE; H=hooks/bash-hot-path-dispatcher.sh;
        [ -x "$H" ] || { echo "dispatcher missing or not executable: $H"; exit 1; }; grep -q "bash-hot-path-dispatcher"
        .claude/settings.json || { echo "dispatcher is not registered in .claude/settings.json"; exit 1;
        }; mk() { printf ''{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"%s"},"cwd":"%s","session_id":"doc-truth-probe"}''
        "$1" "$PWD"; }; BAD="rm cos_lib/harness_adapter/codex.py && ln -s ../../packages/agent-lifecycle/lib/harness_adapter/codex.py
        cos_lib/harness_adapter/codex.py"; OK="ls -la cos_lib/harness_adapter/codex.py"; mk "$BAD" | bash
        "$H" >/dev/null 2>&1; bad=$?; mk "$OK" | bash "$H" >/dev/null 2>&1; ok=$?; [ "$bad" -eq 2 ] || {
        echo "incident payload was NOT blocked: dispatcher exit $bad, expected 2"; exit 1; }; [ "$ok" -eq
        0 ] || { echo "innocent payload was blocked: dispatcher exit $ok, expected 0"; exit 1; }; echo
        "symlink-mutation-guard blocks the incident payload (exit 2) and allows an innocent one (exit 0)"'
      surface:
      - templates/agent-mandatory-rules.md
      - templates/project-gotchas.md
      - hooks/bash-hot-path-dispatcher.sh
      - hooks/symlink-mutation-guard.sh
      expect:
        exit_code: 0
      next_action: 'run the hook before believing either verdict. If it stopped blocking, restore the wiring
        in hooks/bash-hot-path-dispatcher.sh; if the guard was deliberately retired, delete the sentence
        from the channel in the same commit -- never grep a registry to decide this'
    - id: cited_rule_files_exist
      claim: Every rule the channel orders the agent to obey exists as rules/<name>.md.
      command:
      - bash
      - -c
      - 'total=0; miss=""; for n in $(sed -n ''s/^- `\([a-z0-9-]*\)`.*/\1/p'' templates/agent-mandatory-rules.md);
        do total=$((total+1)); [ -f "rules/$n.md" ] || miss="$miss $n"; done; [ "$total" -gt 0 ] || { echo
        "no rule bullet found in the channel: nothing was checked"; exit 1; }; [ -z "$miss" ] || { echo
        "cited rule files missing:$miss"; exit 1; }; echo "$total cited rule files exist"'
      surface:
      - templates/agent-mandatory-rules.md
      expect:
        exit_code: 0
      next_action: restore the rule file or stop citing it in the channel
    - id: cited_adrs_exist
      claim: Every ADR the channel cites as authority exists under docs/02-Decisions/adrs/.
      command:
      - bash
      - -c
      - 'total=0; miss=""; for a in $(grep -ohE "ADR-[0-9]{3}" templates/agent-mandatory-rules.md templates/agent-preamble.md
        | sort -u); do total=$((total+1)); ls docs/02-Decisions/adrs/$a-*.md >/dev/null 2>&1 || miss="$miss
        $a"; done; [ "$total" -gt 0 ] || { echo "no ADR cited by the channel: nothing was checked"; exit
        1; }; [ -z "$miss" ] || { echo "cited ADRs missing:$miss"; exit 1; }; echo "$total cited ADRs exist"'
      surface:
      - templates/agent-mandatory-rules.md
      - templates/agent-preamble.md
      expect:
        exit_code: 0
      next_action: fix the ADR number in the channel, or stop citing it
    - id: channel_is_still_delivered
      claim: The injector is registered on SubagentStart with an empty matcher, so the channel reaches every
        sub-agent unconditionally.
      command:
      - python3
      - -c
      - 'import json,sys

        groups=json.load(open(''.claude/settings.json'')).get(''hooks'',{}).get(''SubagentStart'',[])

        live=[g for g in groups if any(''subagent-context-injector.sh'' in (h.get(''command'') or '''')
        for h in g.get(''hooks'',[]))]

        print(''SubagentStart groups carrying the injector:'', len(live), ''| matchers:'', [g.get(''matcher'','''')
        for g in live])

        sys.exit(0 if live and all((g.get(''matcher'') or '''')=='''' for g in live) else 1)

        '
      surface:
      - .claude/settings.json
      - hooks/subagent-context-injector.sh
      expect:
        exit_code: 0
      next_action: re-register the injector, or delete this claim because the channel no longer exists
    - id: gotchas_channel_delivers_the_file
      claim: 'Channel B (hooks/inject-phase-context.sh) really hands templates/project-gotchas.md
        to an agent whose prompt names hooks/ or settings.json, and withholds it otherwise. Every
        other assertion about that file defends text nobody may be reading: this one checks the
        delivery, by running the hook and looking for the file''s own H1 in the emitted JSON. It
        pins the production condition -- CLAUDE_PROJECT_DIR set -- on purpose. Without it the hook
        resolves PROJECT_DIR to $(dirname $0)/../.., which for a hook at <repo>/hooks/ is the
        PARENT of the repo: the yaml, the phase, the project name and this whole file are lost in
        silence (measured 2026-08-20: 1636 bytes out and PROJECT: my-project, versus 8645 bytes
        with the variable set). The negative half matters as much: if the keyword gate ever stops
        filtering, the file lands in every prompt and the 10K additionalContext cap starts eating
        whatever follows it.'
      command:
      - bash
      - -c
      - |
        set -u
        unset COS_BYPASS COS_ALLOW_PROTECTED_CONFIG_WRITE
        H=hooks/inject-phase-context.sh; G=templates/project-gotchas.md
        [ -f "$H" ] || { echo "channel hook missing: $H"; exit 1; }
        [ -f "$G" ] || { echo "gotchas file missing: $G"; exit 1; }
        grep -q 'inject-phase-context' .claude/settings.json || { echo "channel hook is not registered in .claude/settings.json"; exit 1; }
        SENTINEL=$(grep -m1 '^# Project Gotchas' "$G" | LC_ALL=C sed 's/[^ -~].*//; s/[[:space:]]*$//')
        [ "${#SENTINEL}" -ge 12 ] || { echo "no ASCII-only H1 sentinel could be read from $G (got '$SENTINEL'): nothing could be looked for"; exit 1; }
        export CLAUDE_PROJECT_DIR="$PWD"
        fire() {
          local sid="doc-truth-probe-$$-$1" out
          export COGNITIVE_OS_SESSION_ID="$sid"
          out=$(printf '{"hook_event_name":"PreToolUse","tool_name":"Agent","tool_input":{"prompt":"%s"},"cwd":"%s","session_id":"doc-truth-probe"}' "$2" "$PWD" | bash "$H" 2>/dev/null)
          case "$PWD/.cognitive-os/sessions/$sid" in
            */doc-truth-probe-*) rm -f "$PWD/.cognitive-os/sessions/$sid/.gotchas-injected" 2>/dev/null
                                 rmdir "$PWD/.cognitive-os/sessions/$sid" 2>/dev/null ;;
          esac
          printf '%s' "$out"
        }
        HIT=$(fire hit "rewire hooks/ and settings.json")
        MISS=$(fire miss "write a haiku about the sea")
        case "$HIT" in
          *"$SENTINEL"*) ;;
          *) echo "channel did NOT deliver $G on a hooks/settings.json prompt (${#HIT} bytes emitted)"; exit 1 ;;
        esac
        case "$MISS" in
          *"$SENTINEL"*) echo "the keyword gate no longer filters: $G now ships in EVERY agent prompt"; exit 1 ;;
        esac
        echo "channel B delivered $G on a keyword prompt (${#HIT} bytes) and withheld it on an unrelated one (${#MISS} bytes)"
      surface:
      - hooks/inject-phase-context.sh
      - templates/project-gotchas.md
      - .claude/settings.json
      expect:
        exit_code: 0
      next_action: 'if delivery broke, fix the keyword branch in hooks/inject-phase-context.sh; if
        the gate stopped filtering, restore it before the 10K cap silently truncates the rest of the
        prompt. Never conclude either from reading the hook -- run it'
    - id: cos_lib_directory_symlinks_match_the_prose
      claim: 'Both channels tell every agent that THREE whole cos_lib directories are symlinks, and
        name each one with its packages/ target. That is a census, not advice: a fourth one, or a
        retargeted one, makes the sentence false in every agent prompt on the day it lands. The
        probe reads the filesystem (readlink) and demands the prose describe what it found -- the
        opposite direction from the sentence, which was written by reading the prose.'
      command:
      - bash
      - -c
      - |
        set -u
        G=templates/project-gotchas.md; H=hooks/inject-phase-context.sh
        [ -f "$G" ] && [ -f "$H" ] || { echo "a channel file is missing"; exit 1; }
        n=0; bad=""
        for l in $(find cos_lib -maxdepth 1 -type l); do
          [ -d "$l" ] || continue
          n=$((n+1)); t=$(readlink "$l"); t=${t#../}
          grep -Fq "$l" "$G" || bad="$bad [$l not named in gotchas]"
          grep -Fq "$t" "$G" || bad="$bad [$l -> $t target not in gotchas]"
          grep -Fq "$l" "$H" || bad="$bad [$l not named in the hook]"
        done
        [ "$n" -gt 0 ] || { echo "no directory symlink found under cos_lib: nothing was checked"; exit 1; }
        grep -Fq "three whole directories are symlinks" "$G" || { echo "the gotchas no longer states a count for cos_lib directory symlinks"; exit 1; }
        [ "$n" -eq 3 ] || { echo "prose says three whole directories are symlinks; measured $n"; exit 1; }
        [ -z "$bad" ] || { echo "cos_lib directory symlinks the channel does not describe:$bad"; exit 1; }
        echo "$n cos_lib directory symlinks, each named with its target in both channel files"
      surface:
      - templates/project-gotchas.md
      - hooks/inject-phase-context.sh
      expect:
        exit_code: 0
      next_action: recount with `find cos_lib -maxdepth 1 -type l` and rewrite the sentence in BOTH
        channel files, or drop the digits and leave the command
    - id: toplevel_dir_symlink_is_not_caught
      claim: 'The gotchas carries the guard''s LIMIT as well as its reach: recreating a TOP-LEVEL
        directory symlink is not caught, only a relative target whose parent chain already contains
        a symlink. A limit is the half nobody re-tests, and it is the dangerous half -- an agent
        reading "this is blocked" without the limit believes the guard will stop it, and an agent
        reading a limit that silently closed wastes the session working around a guard that would
        have let it through. The probe feeds the top-level payload and demands exit 0, so it is the
        exact mirror of blocking_hook_actually_blocks: the two together say where the wall is.'
      command:
      - bash
      - -c
      - |
        set -u
        unset COS_ALLOW_SYMLINK_MUTATION COS_BYPASS COS_ALLOW_PROTECTED_CONFIG_WRITE
        H=hooks/bash-hot-path-dispatcher.sh
        [ -x "$H" ] || { echo "dispatcher missing or not executable: $H"; exit 1; }
        grep -Fq "recreating a top-level dir symlink is not caught" templates/project-gotchas.md \
          || { echo "the gotchas no longer states the guard's limit: nothing to defend"; exit 1; }
        mk() { printf '{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"%s"},"cwd":"%s","session_id":"doc-truth-probe"}' "$1" "$PWD"; }
        TOP="rm cos_lib/providers && ln -s ../packages/llm-providers/lib cos_lib/providers"
        NESTED="rm cos_lib/harness_adapter/codex.py && ln -s ../../packages/agent-lifecycle/lib/harness_adapter/codex.py cos_lib/harness_adapter/codex.py"
        mk "$TOP" | bash "$H" >/dev/null 2>&1; top=$?
        mk "$NESTED" | bash "$H" >/dev/null 2>&1; nested=$?
        [ "$nested" -eq 2 ] || { echo "the nested payload is no longer blocked (exit $nested): the probe cannot tell the two cases apart, so its exit 0 would prove nothing"; exit 1; }
        [ "$top" -eq 0 ] || { echo "the top-level payload IS caught now (exit $top): the documented limit is stale and agents are being told the guard is narrower than it is"; exit 1; }
        echo "guard limit holds: nested relative target blocked (exit 2), top-level dir symlink allowed (exit 0)"
      surface:
      - templates/project-gotchas.md
      - hooks/bash-hot-path-dispatcher.sh
      - hooks/symlink-mutation-guard.sh
      expect:
        exit_code: 0
      next_action: if the guard was widened to cover top-level directory symlinks, delete the limit
        clause from the gotchas in the same commit; if it was narrowed, blocking_hook_actually_blocks
        goes red first and that is the entry to fix
    - id: efficiency_profile_tiers
      claim: 'The gotchas told every agent the efficiency profile is "two-tier (default | full)".
        It is not, and the sentence came from re-reading the comment in cognitive-os.yaml rather
        than from the script that resolves it: scripts/apply-efficiency-profile.sh accepts seven
        spellings and resolves them onto THREE tiers -- core, maintainer, full -- with `default`
        landing on `maintainer`. An agent told there are two tiers cannot reason about the one it
        is actually running under. The probe reads the tiers off the case arm that keeps the name
        it was given, so config prose can never be its own witness again.'
      command:
      - bash
      - -c
      - |
        set -u
        S=scripts/apply-efficiency-profile.sh; G=templates/project-gotchas.md
        [ -f "$S" ] || { echo "profile driver missing: $S"; exit 1; }
        TIERS=$(awk '/^case "\$RAW_PROFILE" in/{c=1} c&&/^[[:space:]]*[a-z|]+\)/{l=$0} c&&/PROFILE="\$RAW_PROFILE"/{gsub(/[^a-z|]/,"",l); print l; exit}' "$S" | tr '|' ' ')
        [ -n "$TIERS" ] || { echo "could not read the tier list off the case arm in $S: nothing was checked"; exit 1; }
        grep -Fq "$TIERS" "$G" || { echo "the gotchas does not carry the tiers the driver resolves to ($TIERS)"; exit 1; }
        echo "efficiency tiers resolved by $S: $TIERS -- and the gotchas says so"
      surface:
      - templates/project-gotchas.md
      - scripts/apply-efficiency-profile.sh
      expect:
        exit_code: 0
      next_action: read the tiers off the case arm and rewrite the sentence in templates/project-gotchas.md
        to match; never copy the tier list out of the comment in cognitive-os.yaml, which is where
        the two-tier claim came from and which is still wrong
    - id: named_symlink_examples_still_hold
      claim: 'The gotchas names concrete cos_lib/*.py files as symlinks and one as a regular file,
        so an agent can calibrate "the DEFAULT case is a real file" against something real. Those
        four labels are the fastest-rotting sentence in the file -- a single packaging move flips
        one. The probe reads the names out of the doc itself and asks the filesystem, so adding or
        renaming an example never leaves the check pointing at a stale hardcoded list.'
      command:
      - bash
      - -c
      - |
        set -u
        G=templates/project-gotchas.md
        S=$(grep -m1 '; not a symlink: ' "$G" || true)
        [ -n "$S" ] || { echo "the symlink-examples sentence is gone from $G: nothing was checked"; exit 1; }
        POS=$(printf '%s' "$S" | sed 's/; not a symlink: .*//' | grep -oE 'cos_lib/[A-Za-z0-9_]+\.py' || true)
        NEG=$(printf '%s' "$S" | sed 's/.*; not a symlink: //'  | grep -oE 'cos_lib/[A-Za-z0-9_]+\.py' || true)
        [ -n "$POS" ] || { echo "no symlink example parsed out of the sentence: nothing was checked"; exit 1; }
        [ -n "$NEG" ] || { echo "no regular-file counter-example parsed out of the sentence: nothing was checked"; exit 1; }
        bad=""
        for f in $POS; do [ -L "$f" ] || bad="$bad [$f is quoted as a symlink and is not one]"; done
        for f in $NEG; do
          [ -e "$f" ] || bad="$bad [$f is quoted as a regular file and does not exist]"
          [ -L "$f" ] && bad="$bad [$f is quoted as NOT a symlink and it is one]"
        done
        [ -z "$bad" ] || { echo "the named examples no longer match the filesystem:$bad"; exit 1; }
        echo "examples hold: $(echo $POS | wc -w | tr -d ' ') quoted symlink(s), $(echo $NEG | wc -w | tr -d ' ') quoted regular file(s)"
      surface:
      - templates/project-gotchas.md
      expect:
        exit_code: 0
      next_action: re-measure with `ls -la` and replace the examples in templates/project-gotchas.md
        with files that still have the property the sentence claims
    - id: plans_dir_split_still_holds
      claim: 'Channel B tells every agent working on plans/ that the root plans/ holds only a README
        and the active plans live in .cognitive-os/plans/, and that both exist on purpose. That is
        the sentence that stops an agent "fixing" an apparently empty directory. It is a census of
        two directories and nothing else watches it.'
      command:
      - bash
      - -c
      - |
        set -u
        H=hooks/inject-phase-context.sh
        grep -Fq 'plans/ at root holds only a README' "$H" || { echo "the plans/ sentence is gone from $H: nothing was checked"; exit 1; }
        [ -d plans ] || { echo "plans/ does not exist, but the channel says it does"; exit 1; }
        [ -d .cognitive-os/plans ] || { echo ".cognitive-os/plans does not exist, but the channel sends agents there"; exit 1; }
        extra=$(find plans -mindepth 1 -not -name 'README*' -not -path '*/.*' | head -20)
        [ -z "$extra" ] || { echo "plans/ holds more than a README, so the sentence is now false:"; echo "$extra"; exit 1; }
        active=$(find .cognitive-os/plans -mindepth 1 | wc -l | tr -d ' ')
        [ "$active" -gt 0 ] || { echo ".cognitive-os/plans is empty, so 'active plans are in .cognitive-os/plans/' no longer holds"; exit 1; }
        echo "plans/ holds only a README; .cognitive-os/plans holds $active entr(y|ies)"
      surface:
      - hooks/inject-phase-context.sh
      - plans
      expect:
        exit_code: 0
      next_action: if plans/ gained real content the split is over -- rewrite the sentence in
        hooks/inject-phase-context.sh instead of deleting the file that made it true
