# external-tool-licenses.yaml
# Operator-maintained manifest of upstream tools vendored or ported into Cognitive OS.
# Each entry corresponds to one upstream project. Fields:
#   name          - Human-readable project name
#   upstream_url  - Canonical upstream repository URL
#   spdx          - SPDX license identifier (use UNKNOWN if unconfirmed)
#   status        - ALLOWED | BLOCKED | HOLD | TRIAL-PATTERNS | PATTERN-ONLY
#   copyright     - Exact copyright line from upstream LICENSE (MISSING if not found)
#   attribution   - Attribution line to include in NOTICE
#   cos_files     - COS source files that contain ported/adapted code
#   annex_f       - Path to the Annex F compliance dossier (relative to repo root)
#   notes         - Free-form compliance notes
#
# Fields added 2026-08-15 (additive; the generator reads entries with .get() and
# ignores unknown keys, so older entries stay valid without them):
#   adoption_form    - HOW the upstream relates to this repo. This is the fact a
#                      reviewer needs and the one the older entries do not state.
#                      Vocabulary, narrowest to broadest contact with upstream code:
#                        conceptual-reference   - named in a comment/docstring; no
#                                                 upstream code, no import, no dependency
#                        optional-probe         - code checks whether the upstream
#                                                 package is importable; never imports it
#                        pattern-reimplementation - the idea was rebuilt first-party;
#                                                 no upstream code present
#                        declared-dependency    - listed in requirements/pyproject and
#                                                 imported at runtime; not vendored
#                        ported-code            - upstream source copied and adapted
#   landed           - Date the adoption first reached the default branch, from
#                      `git log --follow --diff-filter=A`
#   license_verified - Date + method the SPDX/copyright fields were checked against
#                      the raw upstream LICENSE (not a README, not memory)
#
# Status vocabulary note (2026-08-15): the four entries added on this date carry
# status INVENTORIED-PENDING-REVIEW. It is not a verdict. It records that the
# adoption is now on the list with its form, files and date established, and that
# nobody has assessed its legal posture. Assigning ALLOWED/BLOCKED/HOLD to these is
# the reviewer's call under manifests/external-tool-adoption-freeze.yaml
# unfreeze_requires item 1, not the inventory's.
#
# Schema version: 1
# Last updated: 2026-08-15

