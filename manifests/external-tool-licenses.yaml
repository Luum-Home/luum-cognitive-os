  - name: "Aider"
    upstream_url: "https://github.com/Aider-AI/aider"
    spdx: "Apache-2.0"
    status: "INVENTORIED-PENDING-REVIEW"
    copyright: "MISSING — upstream LICENSE.txt is the unmodified Apache-2.0 body; the copyright line exists only as the unfilled template in the appendix"
    attribution: "Repo-map concept referenced from Aider-AI/aider (Apache-2.0). Implementation is first-party; no upstream source present."
    adoption_form: "pattern-reimplementation"
    landed: '2026-05-10'
    license_verified: "2026-08-15 — WebFetch of https://raw.githubusercontent.com/Aider-AI/aider/main/LICENSE.txt returned the Apache-2.0 body (Version 2.0, January 2004). Note: Apache-2.0, NOT MIT."
    cos_files:
      - "cos_lib/repo_map.py"
      - "scripts/cos-repo-map"
    annex_f: "NONE — no Annex F dossier was written for this adoption"
    notes: >
      Form evidence, verbatim from the cos_lib/repo_map.py module docstring (lines 4-6):
      "Pattern-port of Aider's repo-map idea: build a compact, token-budgeted map of
      relevant repository files/symbols, then overlay COS governance context. This is
      first-party code; no Aider runtime dependency is required."
      Corroborated mechanically: `grep -rnE '^\s*(import|from)\s+aider\b' --include='*.py' .`
      returns zero rows, and `grep -in aider requirements.txt pyproject.toml` returns zero
      rows — aider is neither imported nor declared as a dependency.
      scripts/cos-repo-map is a 23-line argparse wrapper that calls
      cos_lib.repo_map.build_repo_map; it contains no upstream-derived logic.
      SEPARATE RELATIONSHIP, deliberately not listed in cos_files because no code is
      adopted: cos_lib/harness_adapter/aider.py (registered in
      cos_lib/compatibility_layer.py:97-98) parses aider's chat-transcript FORMAT
      (.aider.chat.history.md) so COS can ingest sessions produced by the tool. That is
      interoperability with an output format, a different relationship from porting an
      idea, and it is recorded here so a reviewer sees both and can tell them apart.
      install.sh also lists "aider" as a supported harness target (line 25).
      NOT ASSESSED by this entry: whether the reimplementation is substantively
      independent of upstream's algorithm. This entry records that the docstring
      declares a pattern-port and that no upstream source is present; it does not
      compare the two implementations.

  - name: "DSPy"
