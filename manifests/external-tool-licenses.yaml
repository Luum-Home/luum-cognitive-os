    status: "INVENTORIED-PENDING-REVIEW"
    copyright: "Copyright (c) 2023 Stanford Future Data Systems"
    attribution: "Optional integration seam for stanfordnlp/dspy (MIT). No upstream source present; the package is probed for, never imported."
    adoption_form: "optional-probe"
    landed: '2026-05-10'
    license_verified: "2026-08-15 — WebFetch of https://raw.githubusercontent.com/stanfordnlp/dspy/main/LICENSE returned MIT with the copyright line quoted above."
    cos_files:
      - "cos_lib/dspy_pilot.py"
      - "scripts/cos-dspy-pilot"
    annex_f: "NONE — no Annex F dossier was written for this adoption"
    notes: >
      Weakest form of contact in this manifest. cos_lib/dspy_pilot.py is 46 lines and
      the only reference to upstream is a capability probe:
      `importlib.util.find_spec("dspy") is not None`. It never imports dspy; the
      dataclass (DspyPilotReport) and the input/output signature it emits are written
      in-repo. `grep -rnE '^\s*(import|from)\s+dspy\b' --include='*.py' .` returns zero
      rows, and dspy appears in neither requirements.txt nor pyproject.toml — so the
      probe reports status "dependency-missing" on a default install.
      What IS borrowed is vocabulary: "signature" with inputs/outputs is DSPy's term of
      art, here a plain dict returned by sdd_verify_signature().
      Already recorded elsewhere, though not as a license entry:
      manifests/feature-tool-due-diligence.yaml:23-26 carries tool_id dspy with the same
      upstream link. That is a due-diligence row, not an attribution row; this entry does
      not duplicate it, it closes the license-manifest gap.

