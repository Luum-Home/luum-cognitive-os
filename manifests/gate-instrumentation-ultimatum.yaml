# SCOPE: os-only
# Gate instrumentation ultimatum ledger (2026-08-21).
# Real YAML on purpose: the sibling manifests/hook-registration-classification.yaml
# is JSON wearing a .yaml extension, a wart this file does not repeat.
# Gate: .venv/bin/python3 scripts/audit_omission_expiry.py
schema_version: gate-instrumentation-ultimatum/v1
owner: unassigned
scope: 'Gates classified `unmeasured` by scripts/audit_gate_liveness.py: wired and reachable, with a blocking
  exit nobody has ever seen taken. Not omissions from registration -- these ARE registered. Sibling ledger
  to manifests/hook-registration-classification.yaml, same mechanism (a dated commitment with an owner),
  different subject.'
why_a_separate_file: hook-registration-classification.yaml is contractually the list of top-level hooks
  ABSENT from .claude/settings.json; tests/audit/test_hook_registration_classification.py asserts that
  set equality. Adding a registered gate there would turn that test red for the wrong reason.
decision: 'Operator ultimatum 2026-08-21: 30 days to instrument (a test that proves the blocking exit
  can be taken, or telemetry that shows it taken) or the gate is removed. The removal is done BY A PERSON.
  Nothing in this repo unregisters a hook because a date passed.'
on_expiry: REPORT ONLY. scripts/audit_omission_expiry.py emits a warn finding per overdue row. A person
  then instruments, extends with a written reason, or deletes.
snapshot:
  taken_on: '2026-08-21'
  head: 1b026c462a1c06aafb2d5aa9b05da47148214618
  command: .venv/bin/python3 scripts/audit_gate_liveness.py --json --quadrant unmeasured
  population_at_snapshot: 72
  note: This is a SNAPSHOT, not a live query. audit_gate_liveness reads growing telemetry, so re-running
    it later can move a row out of `unmeasured` (that is the win) or move a new one in (that needs a new
    row here). The expiry checker does not re-derive the list; re-run the command above to refresh it.
