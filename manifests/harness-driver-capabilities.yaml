schema_version: 1
description: >
  Driver capability matrix for projecting Cognitive OS hooks into agent
  harness settings. This is not the hook source of truth; it records what each
  harness driver can safely express today.

drivers:
  claude:
    settings_path: .claude/settings.json
    shape: nested_hooks
    supported_events:
      SessionStart:
        status: supported
      UserPromptSubmit:
        status: supported
      SubagentStart:
        status: supported
      PreCompact:
        status: supported
      PreToolUse:
        status: supported
        matcher_semantics: tool_pattern
      PostToolUse:
        status: supported
        matcher_semantics: tool_pattern
      Stop:
        status: supported
      TeammateIdle:
        status: cognitive_os_extension
      TaskCreated:
        status: cognitive_os_extension
      TaskCompleted:
        status: cognitive_os_extension

  codex:
    settings_path: .codex/hooks.json
    shape: native_lifecycle_keys
    # version_baseline = la version de Codex contra la que COS tiene evidencia
    # local (fixtures + adapter). NO es "la ultima version de Codex".
    version_baseline: "0.126.0-alpha.8"
    upstream_version: "0.148.0"
    upstream_version_note: >
      Al 2026-08-19 el canal estable de Codex va en 0.148.0 (publicado
      2026-08-18) y el alpha en 0.149.0-alpha.1. El baseline local esta 22
      minors atras. Cadencia medida: 5.62 dias por minor en los ultimos 90
      dias, 3.17 dias por minor sobre los 129 minors estables publicados.
    docs_url: https://learn.chatgpt.com/docs/hooks
    verified: 2026-08-19
    how: >
      version: curl -s https://registry.npmjs.org/@openai/codex | python3 -c
      "import json,sys; print(json.load(sys.stdin)['dist-tags']['latest'])";
      capacidades de hooks: curl -sL https://developers.openai.com/codex/hooks
      (308 -> https://learn.chatgpt.com/docs/hooks) y leer la seccion
      "Tool coverage".
    upstream_hook_limitation: >
      permissionDecision "ask" esta parseado pero NO implementado: Codex marca
      la corrida del hook como fallida y CONTINUA la tool call. Una guarda que
      pida confirmacion en Codex no protege nada. Detalle y cita textual en
      manifests/codex-hooks-schema.yaml -> blocking.parsed_but_not_supported_yet.
    evidence:
      - tests/fixtures/codex-live-session/
      - cos_lib/harness_adapter/codex.py
      - internal/provider/codex.go
      - docs/06-Daily/reports/codex-permiso-silencioso-2026-08-19.md
    supported_events:
      SessionStart:
        status: supported
      UserPromptSubmit:
        status: supported
      Stop:
        status: supported
      PreToolUse:
        status: limited
        matcher_semantics: bash_only
        governed_fallback: scripts/cos_governed_runner.py
        governed_wrapper: scripts/cos_codex_guard.py
        governed_matchers:
          - Agent
          - Edit
          - Write
        limitation: >
          POLITICA DEL DRIVER, NO LIMITE DE CODEX. Upstream documenta cobertura
          para shell (Bash), unified exec (exec_command, tambien matcheable
          como Bash), apply_patch (matcheable como apply_patch / Edit / Write),
          herramientas MCP (mcp__*) y otras function tools locales; solo las
          hosted tools (WebSearch) quedan fuera. COS igual trata la cobertura
          como Bash-only hasta tener payloads locales que lo prueben, y el
          adapter emite un codex_tool_coverage_gap para eventos no-Bash. Las
          cadenas Agent/Edit/Write corren por el runner gobernado de COS en vez
          de proyectarse como hooks nativos de Codex.
          Verificado 2026-08-19 contra https://learn.chatgpt.com/docs/hooks
          (seccion "Tool coverage"). Advertencia upstream textual: "Some
          specialized tool paths can opt out of the default hook path. Treat
          tool hooks as a useful guardrail, not a complete enforcement
          boundary"
      PostToolUse:
        status: limited
        matcher_semantics: bash_only
        governed_fallback: scripts/cos_governed_runner.py
        governed_wrapper: scripts/cos_codex_guard.py
        governed_matchers:
          - Agent
          - Edit
          - Write
        limitation: >
          POLITICA DEL DRIVER, NO LIMITE DE CODEX. Upstream documenta cobertura
          para shell (Bash), unified exec (exec_command, tambien matcheable
          como Bash), apply_patch (matcheable como apply_patch / Edit / Write),
          herramientas MCP (mcp__*) y otras function tools locales; solo las
          hosted tools (WebSearch) quedan fuera. COS igual trata la cobertura
          como Bash-only hasta tener payloads locales que lo prueben, y el
          adapter emite un codex_tool_coverage_gap para eventos no-Bash. Las
          cadenas Agent/Edit/Write corren por el runner gobernado de COS en vez
          de proyectarse como hooks nativos de Codex.
          Verificado 2026-08-19 contra https://learn.chatgpt.com/docs/hooks
          (seccion "Tool coverage"). Advertencia upstream textual: "Some
          specialized tool paths can opt out of the default hook path. Treat
          tool hooks as a useful guardrail, not a complete enforcement
          boundary"
      # `status` describe lo que ESTE DRIVER proyecta, no lo que el arnes
      # soporta. Donde los dos difieren, `upstream_status` lo dice; moverlo a
      # `limited` cambiaria el veredicto de scripts/harness_parity_audit.py y
      # del ratchet de tests/red_team/portability/test_hook_projection_drift_audit.py,
      # que solo baja. Reclasificarlos es decision del operador, no del que
      # corrige la doc.
      SubagentStart:
        status: unsupported
        upstream_status: supported
        upstream_verified: 2026-08-19
        limitation: >
          Codex SI soporta SubagentStart (evento documentado, matcher = tipo de
          subagente, acepta additionalContext; `continue: false` se parsea pero
          no frena el subagente). El gap es de COS: el unico hook SubagentStart
          del registro no se proyecta a Codex. Fuente:
          https://learn.chatgpt.com/docs/hooks.
      PreCompact:
        status: unsupported
        upstream_status: supported
        upstream_verified: 2026-08-19
        limitation: >
          Codex SI soporta PreCompact y PostCompact (eventos documentados,
          matcher enum manual|auto). El gap es de COS: PreCompact existe en el
          registro canonico y no se proyecta, y PostCompact no tiene evento
          equivalente en COS. Fuente: https://learn.chatgpt.com/docs/hooks.
      TeammateIdle:
        status: cognitive_os_extension
        projection: requires_cos_runner
      TaskCreated:
        status: cognitive_os_extension
        projection: requires_cos_runner
      TaskCompleted:
        status: cognitive_os_extension
        projection: requires_cos_runner

  opencode:
    settings_path: opencode.json
    plugin_paths:
      - .opencode/plugins/
      - ~/.config/opencode/plugins/
    shape: opencode_json_plus_plugin_hooks
    version_baseline: "official-docs-2026-05-08"
    evidence:
      - https://opencode.ai/docs/plugins/
      - https://opencode.ai/docs/agents/
      - https://open-code.ai/en/docs/rules
      - scripts/_lib/settings-driver-opencode.sh
      - cos_lib/harness_adapter/opencode.py
      - packages/opencode-adapter/plugins/cos-primitive-guard.js
      - scripts/opencode_primitive_adapter_smoke.py
    supported_events:
      SessionStart:
        status: supported
        native_event: session.created
        projection: settings-driver-opencode.sh plus cos-primitive-guard.js
      UserPromptSubmit:
        status: supported
        native_event: tui.prompt.append
        projection: settings-driver-opencode.sh plus cos-primitive-guard.js
      PreToolUse:
        status: supported
        native_event: tool.execute.before
        matcher_semantics: tool_name_and_args
        enforcement: plugin_can_mutate_or_throw
      PostToolUse:
        status: supported
        native_event: tool.execute.after
        matcher_semantics: tool_name_and_args
      Stop:
        status: supported
        native_event: session.idle
        projection: settings-driver-opencode.sh plus cos-primitive-guard.js
      SubagentStart:
        status: limited
        native_surface: agent.task_permissions
        limitation: >
          OpenCode supports primary/subagents and task permissions, but COS has
          not yet signed lifecycle parity for SubagentStart.
      PreCompact:
        status: limited
        native_event: session.compacted
        legacy_native_event: experimental.session.compacting
        limitation: >
          Current OpenCode docs expose session.compacted while older builds may
          use experimental.session.compacting. COS accepts both in the plugin,
          but keeps PreCompact limited until compaction semantics are stable.
      TeammateIdle:
        status: cognitive_os_extension
        projection: requires_cos_or_opencode_plugin_adapter
      TaskCreated:
        status: cognitive_os_extension
        projection: requires_cos_or_opencode_plugin_adapter
      TaskCompleted:
        status: cognitive_os_extension
        projection: requires_cos_or_opencode_plugin_adapter

  bare_cli:
    settings_path: .cognitive-os/cos-runner-hooks.json
    shape: cos_runner_event_json
    description: >
      Bare-CLI / CI harness: cos-agent and cos-skill run in plain shell with
      no surrounding harness.  Events are emitted as canonical JSON to stdin
      of the BareCliAdapter.  Adapter file: cos_lib/harness_adapter/bare_cli.py.
    version_baseline: "adr-064-p0"
    evidence:
      - cos_lib/harness_adapter/bare_cli.py
      - cos_lib/agent_runner.py
      - bin/cos-agent
      - tests/unit/test_harness_adapter_bare_cli.py
    supported_events:
      SessionStart:
        status: supported
      UserPromptSubmit:
        status: supported
      ToolUseStart:
        status: supported
      ToolUseEnd:
        status: supported
      SessionEnd:
        status: supported
      PreCompact:
        status: unsupported
        limitation: >
          Bare CLI has no native context-compaction; COS_CONTEXT_COMPRESS=1
          triggers lib.context_compressor manually if needed.
      SubagentStart:
        status: unsupported
      TeammateIdle:
        status: unsupported
      TaskCreated:
        status: unsupported
      TaskCompleted:
        status: unsupported

parity_policy:
  required_statuses:
    - supported
  advisory_statuses:
    - limited
    - cognitive_os_extension
  unsupported_statuses:
    - unsupported

  rules:
    - id: supported-events-must-project
      description: >
        If a hook is registered in the reference driver for an event that the
        target driver marks supported, the target driver should either project
        it or document an explicit exception.
    - id: limited-events-are-not-parity-failures
      description: >
        Missing hooks on limited target events are capability gaps, not parity
        regressions. They should appear in reports so the roadmap remains
        honest.
    - id: unsupported-events-must-not-be-copied-blindly
      description: >
        Do not copy unsupported event registrations into a target driver just
        to make counts match. Add a runner, adapter, or documented projection
        path first.
