schema_version: provenance-scan/v1
provenance:
  forbidden_terms: []
  forbidden_paths: []
  # Private source projects that must not appear as a component of a local project path.
  # HMAC-SHA256(secret key, lowercased name), never the name itself: a committed
  # list of names to protect is the leak it tries to prevent, and a plain hash of
  # a short name is confirmed by anyone who suspects it. The key and the clear
  # list live outside the repo; regenerate with `python3 scripts/leak_terms_hmac.py`.
  # See docs/04-Concepts/architecture/provenance-scan-guardrail.md.
  forbidden_path_hmac:
    # BEGIN leak-terms-hmac (generated by scripts/leak_terms_hmac.py; do not edit)
    - "031961ac11795861c9002128ea4d180faa84e1bc6688e33ec79e6f800592ac44"
    - "5d2a0b57a0a18c259fd567b55ab81096bfc54789630e64bfdb8a5b5cc0888295"
    - "5f135f6d8f233d3b442e45f8fee6eab645ab9901b3ab0ab3412db0c1f8a0723c"
    - "b9bcb6a7b622ce85cf0ff6282aafb50d07d6d88cf7cd63abc1d730025c6bcd36"
    - "ed5874a120e0f43eb838fddef85da3966f3ec336e614a827446f5f9956410dce"
    # END leak-terms-hmac
  forbidden_provenance_language:
    - '(?i)sourcePattern:\s*adapted-'
  allowed_absolute_paths:
    - /tmp/
    - /var/folders/
    - /private/var/folders/
    - /home/jovyan/
  allowed_import_roots:
    go: []
    python: []
    ts: []
  forbidden_import_roots:
    go: []
    python: []
    ts: []
  exclude_globs:
    - "tests/unit/test_provenance_scan.py"
    - ".claude/plugins/**"
    - "docs/06-Daily/reports/**"
    - "docs/07-Capabilities/acc/latest.json"
    - ".ai/primitives/**"
  scan_imports: true
  scan_path_hacks: true
